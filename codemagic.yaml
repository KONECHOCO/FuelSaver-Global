# FuelSaver — build per App Store e Play Store.
# Gli ID AdMob (non segreti) sono in .env.production e ios/App/App/Info.plist.
workflows:
  ios-app-store:
    name: FuelSaver iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ikonet.fuelsaver
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      xcode: latest
      node: 22
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Set up signing profiles
        script: xcode-project use-profiles
      - name: Apply Codemagic build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA for App Store Connect
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: FuelSaver Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - fuelsaver_android
      vars:
        PACKAGE_NAME: "com.ikonet.fuelsaver"
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app and sync Android project
        script: |
          npm run build
          npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
